[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoforge-omega"
version = "0.1.0"
description = "Universal autonomous repository engineering system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
repoforge = "repoforge.cli:main"

[tool.setuptools.packages.find]
include = ["repoforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
